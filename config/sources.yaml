# News sources. DRAFT — reviewed by the owner before use.
#
# Fields
#   id               short unique key. NEVER rename: history and dedupe are keyed on it.
#   name             display name
#   url              RSS/Atom feed URL
#   region           us | europe | south_asia | middle_east | africa | east_asia | latam
#                    (by the audience covered: RT sits in europe; El País América in latam)
#   country          ISO 3166 alpha-2 of the outlet's home base
#   language         ISO 639-1 (non-English is translated by the AI)
#   lean_axis        us       -> US left/right spectrum
#                    uk       -> UK left/right spectrum
#                    national -> that country's own left/right spectrum (not comparable across
#                                countries: Spain's centre-left is not Brazil's)
#                    local    -> stance toward that country's government (see the note)
#   baseline_lean    -2..+2
#                    us/uk/national: -2 left, -1 centre-left, 0 centre, +1 centre-right, +2 right
#                    local:          -2 strongly critical of government .. +2 strongly pro-government
#   ownership        private        -> commercial or non-profit, no state control
#                    public_service -> state-owned or publicly funded, WITH legal editorial
#                                      independence (BBC, Yonhap)
#                    state          -> state-owned or state-funded WITHOUT legal editorial
#                                      independence; shown as 🏛 in messages
#   gov_aligned      true only with documented ownership or legal control that ties the outlet
#                    to its government's line, even when privately owned. Never set for
#                    editorial sympathy alone.
#   reliability_note only where Media Bias/Fact Check rates factual reporting Mixed or lower,
#                    whatever the outlet's lean. Passed to the AI judge.
#   note             why this baseline, for people reading this file. Not sent to the AI judge:
#                    characterisations here would anchor it on reputation (ADR 0008).
#   enabled          optional, default true. false stops fetching but keeps the entry and its
#                    history (keyed on id). Add a comment saying why and when.
#
# How baselines were set
#   us / uk:  guided by AllSides, Ad Fontes Media and Media Bias/Fact Check.
#   national: guided by MBFC where rated, and by the outlet's reputation in its own country.
#   local:    editorial judgments by the project owner. No public rating covers stance toward a
#             government, so these are not externally validated.
# The AI judge scores each article against this baseline (ADR 0002).

sources:
  # ── United States ────────────────────────────────────────────────────────
  - id: huffpost
    name: HuffPost
    url: https://www.huffpost.com/section/world-news/feed
    region: us
    country: US
    language: en
    lean_axis: us
    baseline_lean: -2
    ownership: private
    gov_aligned: false
    note: Rated left by AllSides; strong progressive framing.

  - id: nyt
    name: The New York Times
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    region: us
    country: US
    language: en
    lean_axis: us
    baseline_lean: -1
    ownership: private
    gov_aligned: false
