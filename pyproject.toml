[project]
name = "news-summariser"
version = "0.1.0"
description = "Daily Telegram digest comparing how left, right and international outlets frame the same news."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
news-summariser = "news_summariser:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors · I: import order · B: likely bugs · UP: modern syntax · SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
